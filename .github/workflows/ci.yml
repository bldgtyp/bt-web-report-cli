name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bt-web-report-cli

    steps:
      - name: Check out CLI
        uses: actions/checkout@v4
        with:
          path: bt-web-report-cli

      - name: Check out schemas
        uses: actions/checkout@v4
        with:
          repository: bldgtyp/bt-web-report-schemas
          path: bt-web-report-schemas
          token: ${{ secrets.BLDGTYP_REPO_READ_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            bt-web-report-cli/pyproject.toml
            bt-web-report-schemas/pyproject.toml

      - name: Install package
        run: |
          uv venv --python 3.11
          uv pip install -e ../bt-web-report-schemas -e ".[dev]"

      - name: Check formatting
        run: uv run --no-sync black --check src tests

      - name: Run tests
        run: uv run --no-sync pytest
