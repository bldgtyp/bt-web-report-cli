# Pre-commit hooks for bt-web-report-cli.
#
# One-time setup (per local clone):
#   uv tool install pre-commit
#   pre-commit install
#
# These mirror the (small) CLI CI checks so failures surface before push.

repos:
  - repo: local
    hooks:
      - id: black
        name: black (py311 target)
        entry: uv run black --target-version py311
        language: system
        types_or: [python]
        require_serial: true
